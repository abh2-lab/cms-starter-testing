# nginx config baked into the admin image. Two responsibilities:
#  1. Serve the Vite-built SPA from /usr/share/nginx/html, with the standard
#     SPA fallback so Vue Router's history-mode routes don't 404 on refresh.
#  2. Reverse-proxy /api/* to the `api` compose service so the SPA hits the
#     same origin it expects in dev. The session cookie's Path=/ and
#     SameSite=Lax then work unchanged.
#
# Body limit is 25M to match the API's max image upload size — keeping nginx
# from rejecting a multipart POST before Fastify's own validator can.

server {
    listen       80;
    server_name  _;

    # Realistic uploads ceiling. The API enforces its own limits; this just
    # prevents nginx from 413'ing first with a less helpful error.
    client_max_body_size 25M;

    root   /usr/share/nginx/html;
    index  index.html;

    # ─── API + ancillary backend routes ────────────────────────────────────
    # Anything the Fastify API exposes goes through here. We do NOT proxy
    # /assets/ or other static-asset paths — those are SPA bundles served below.
    location /api/ {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Long-poll / streaming endpoints would need these; harmless otherwise.
        proxy_buffering    off;
        proxy_read_timeout 60s;
    }

    # Swagger UI is mounted at /docs by Fastify — only present in non-prod
    # builds of the API, but proxy unconditionally so dev images work too.
    location /docs {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ─── SPA fallback ──────────────────────────────────────────────────────
    # Vite emits hashed assets under /assets/, so cache them aggressively.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else falls back to index.html for vue-router history mode.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
